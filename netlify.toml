[build]
  command = "unset NODE_ENV && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These values are public build configuration, not credentials. The dataset
  # value (usually "production") and project ID are intentionally embedded in
  # the Sanity browser client, so Netlify must not treat them as leaked secrets.
  # SANITY_API_WRITE_TOKEN remains scanned and server-only.
  SECRETS_SCAN_OMIT_KEYS = "SANITY_PROJECT_ID,SANITY_DATASET,SECRETS_SCAN_OMIT_KEYS"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
