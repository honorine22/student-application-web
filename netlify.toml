[build]
  command = "unset NODE_ENV && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NODE_ENV is controlled by Next.js and is not a secret. Some older site
  # settings may still define it, causing Netlify to flag ordinary build text.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV"
