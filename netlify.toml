[build]
  command = "rm -rf .next/cache/turbopack .netlify/.next/cache/turbopack && unset NODE_ENV SITE_MAIL_RECIEVER SMTP_SERVER_HOST SMTP_SERVER_USERNAME SMTP_SERVER_PASSWORD && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These values are public build configuration, not credentials. The dataset
  # value (usually "production") and project ID are intentionally embedded in
  # the Sanity browser client, so Netlify must not treat them as leaked secrets.
  # SANITY_API_WRITE_TOKEN remains scanned and server-only.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,SANITY_DATASET,SANITY_PROJECT_ID"
